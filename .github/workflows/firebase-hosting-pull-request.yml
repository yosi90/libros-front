name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run the deterministic QA gate
        run: npm run qa:ci
      - name: Upload public QA evidence on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: preview-qa-failure
          path: |
            coverage/
            playwright-report/
            test-results/
            !test-results/auth/**
            !test-results/qa-fixtures.json
          if-no-files-found: ignore
          retention-days: 7
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_YOSIFTWARE_LIBROS }}
          projectId: yosiftware-libros
