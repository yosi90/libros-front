name: QA Hosting manual campaign

on:
  workflow_dispatch:
    inputs:
      campaign_scope:
        description: Campaign scope to execute
        required: true
        default: full
        type: choice
        options:
          - phone
          - surfaces
          - full

permissions:
  contents: read
  id-token: write

concurrency:
  group: qa-shared-dataset-and-hosting
  cancel-in-progress: false

jobs:
  reject_non_main:
    name: Reject non-main execution
    if: ${{ github.ref != 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Reject ref outside main
        run: |
          echo "This QA workflow only accepts refs/heads/main."
          exit 1

  qa_wif_and_campaign:
    name: Verify WIF and run the gated QA campaign
    if: ${{ github.ref == 'refs/heads/main' }}
    environment: qa
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: "true"
      FIREBASE_CLI_VERSION: "15.23.0"
      QA_API_BASE_URL: ${{ vars.QA_API_BASE_URL }}
      QA_FRONT_BASE_URL: ${{ vars.QA_FRONT_BASE_URL }}
      QA_DATASET_VERSION: ${{ vars.QA_DATASET_VERSION }}
      QA_FIREBASE_PROJECT_ID: ${{ vars.QA_FIREBASE_PROJECT_ID }}
      QA_FIREBASE_SITE_ID: ${{ vars.QA_FIREBASE_SITE_ID }}
      QA_RESET_TOKEN: ${{ secrets.QA_RESET_TOKEN }}
      QA_ADMIN_PASSWORD: ${{ secrets.QA_ADMIN_PASSWORD }}
      QA_MODERATOR_PASSWORD: ${{ secrets.QA_MODERATOR_PASSWORD }}
      QA_USER_A_PASSWORD: ${{ secrets.QA_USER_A_PASSWORD }}
      QA_USER_B_PASSWORD: ${{ secrets.QA_USER_B_PASSWORD }}
      QA_PHONE_TEST_NUMBER: ${{ secrets.QA_PHONE_TEST_NUMBER }}
      QA_PHONE_TEST_CODE: ${{ secrets.QA_PHONE_TEST_CODE }}
    steps:
      - name: Check out main
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          cache: npm

      - name: Authenticate to Google Cloud with WIF
        id: google_auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.QA_FIREBASE_PROJECT_ID }}
          workload_identity_provider: ${{ vars.QA_WIF_PROVIDER }}
          service_account: ${{ vars.QA_HOSTING_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Verify Firebase Hosting access without deploying
        shell: bash
        run: |
          result_file="$RUNNER_TEMP/qa-hosting-sites.json"
          npx --yes "firebase-tools@${FIREBASE_CLI_VERSION}" hosting:sites:list \
            --project "$QA_FIREBASE_PROJECT_ID" \
            --json > "$result_file"
          node scripts/qa/verify-hosting-site.mjs "$result_file"

      - name: Install dependencies
        if: ${{ vars.QA_HOSTING_DEPLOY_ENABLED == 'true' }}
        run: npm ci

      - name: Install Chromium, Firefox and WebKit
        if: ${{ vars.QA_HOSTING_DEPLOY_ENABLED == 'true' }}
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Audit npm dependencies
        if: ${{ vars.QA_HOSTING_DEPLOY_ENABLED == 'true' && inputs.campaign_scope == 'full' }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            set +e
            audit_output="$(npm audit --audit-level=low --fetch-timeout=60000 2>&1)"
            audit_status=$?
            set -e
            printf '%s\n' "$audit_output"
            if [ "$audit_status" -eq 0 ]; then
              exit 0
            fi
            if ! grep -Eqi 'audit endpoint returned an error|network timeout|ECONNRESET|EAI_AGAIN|ETIMEDOUT|ENOTFOUND|429 Too Many Requests|503 Service Unavailable' <<< "$audit_output"; then
              exit "$audit_status"
            fi
            if [ "$attempt" -eq 3 ]; then
              exit "$audit_status"
            fi
            echo "npm audit no respondió (intento $attempt/3); se reintentará."
            sleep $((attempt * 5))
          done

      - name: Run deterministic QA gate
        if: ${{ vars.QA_HOSTING_DEPLOY_ENABLED == 'true' && inputs.campaign_scope == 'full' }}
        run: npm run qa:ci

      - name: Run the public browser, responsive and visual suites
        if: ${{ vars.QA_HOSTING_DEPLOY_ENABLED == 'true' && inputs.campaign_scope == 'full' }}
        env:
          QA_USE_BUILT_ARTIFACT: "true"
        run: npm run qa:browsers

      - name: Acquire the global QA lease
        if: ${{ vars.QA_HOSTING_DEPLOY_ENABLED == 'true' }}
        run: node scripts/qa/campaign-control.mjs acquire

      - name: Verify the linked QA phone identity in Chromium and Firefox
        if: ${{ vars.QA_HOSTING_DEPLOY_ENABLED == 'true' && inputs.campaign_scope == 'phone' }}
        env:
          PLAYWRIGHT_BASE_URL: ${{ vars.QA_FRONT_BASE_URL }}
          PLAYWRIGHT_SKIP_WEBSERVER: "true"
        run: >-
          node scripts/qa/run-with-lease.mjs
          npx playwright test e2e/authentication.integration.spec.ts
          --config=playwright.integration.config.ts
          --grep "accede con el teléfono ficticio"
          --no-deps

      - name: Build the QA artifact
        if: ${{ vars.QA_HOSTING_DEPLOY_ENABLED == 'true' && inputs.campaign_scope == 'full' }}
        run: node scripts/qa/run-with-lease.mjs npm run build:qa

      - name: Verify the QA PWA artifact
        if: ${{ vars.QA_HOSTING_DEPLOY_ENABLED == 'true' && inputs.campaign_scope == 'full' }}
        run: node scripts/qa/verify-pwa-artifact.mjs

      - name: Test the built artifact in Chromium and Firefox
        if: ${{ vars.QA_HOSTING_DEPLOY_ENABLED == 'true' && inputs.campaign_scope == 'full' }}
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4200
          QA_USE_BUILT_ARTIFACT: "true"
        run: node scripts/qa/run-with-lease.mjs npm run qa:integration

      - name: Renew the lease before deployment
        if: ${{ vars.QA_HOSTING_DEPLOY_ENABLED == 'true' && inputs.campaign_scope == 'full' }}
        run: node scripts/qa/campaign-control.mjs renew

      - name: Prepare the site-specific Hosting configuration
        if: ${{ vars.QA_HOSTING_DEPLOY_ENABLED == 'true' && inputs.campaign_scope == 'full' }}
        run: node scripts/qa/prepare-hosting-config.mjs

      - name: Deploy only Firebase Hosting
        if: ${{ vars.QA_HOSTING_DEPLOY_ENABLED == 'true' && inputs.campaign_scope == 'full' }}
        run: >-
          node scripts/qa/run-with-lease.mjs
          npx --yes firebase-tools@15.23.0 deploy
          --config firebase.qa.generated.json
          --only hosting
          --project "$QA_FIREBASE_PROJECT_ID"
          --non-interactive

      - name: Verify hosted Android App Links association
        if: ${{ vars.QA_HOSTING_DEPLOY_ENABLED == 'true' && inputs.campaign_scope == 'full' }}
        run: node scripts/qa/verify-hosted-app-links.mjs "$QA_FRONT_BASE_URL"

      - name: Run the hosted Chromium, Firefox and WebKit smoke
        if: ${{ vars.QA_HOSTING_DEPLOY_ENABLED == 'true' && inputs.campaign_scope == 'full' }}
        env:
          PLAYWRIGHT_BASE_URL: ${{ vars.QA_FRONT_BASE_URL }}
          PLAYWRIGHT_SKIP_WEBSERVER: "true"
        run: >-
          node scripts/qa/run-with-lease.mjs
          npm run e2e:smoke

      - name: Verify hosted sessions, Firebase providers and product surfaces
        if: ${{ vars.QA_HOSTING_DEPLOY_ENABLED == 'true' && inputs.campaign_scope == 'full' }}
        env:
          PLAYWRIGHT_BASE_URL: ${{ vars.QA_FRONT_BASE_URL }}
          PLAYWRIGHT_SKIP_WEBSERVER: "true"
        run: >-
          node scripts/qa/run-with-lease.mjs
          npx playwright test
          e2e/authentication.integration.spec.ts
          e2e/product-surfaces.integration.spec.ts
          --config=playwright.integration.config.ts

      - name: Diagnose hosted product surfaces
        if: ${{ vars.QA_HOSTING_DEPLOY_ENABLED == 'true' && inputs.campaign_scope == 'surfaces' }}
        env:
          PLAYWRIGHT_BASE_URL: ${{ vars.QA_FRONT_BASE_URL }}
          PLAYWRIGHT_SKIP_WEBSERVER: "true"
        run: >-
          node scripts/qa/run-with-lease.mjs
          npx playwright test
          e2e/product-surfaces.integration.spec.ts
          --config=playwright.integration.config.ts

      - name: Renew the lease before cleanup
        if: ${{ always() && vars.QA_HOSTING_DEPLOY_ENABLED == 'true' }}
        run: node scripts/qa/campaign-control.mjs renew-cleanup

      - name: Restore the baseline dataset
        if: ${{ always() && vars.QA_HOSTING_DEPLOY_ENABLED == 'true' }}
        run: node scripts/qa/campaign-control.mjs reset-baseline

      - name: Release the global QA lease
        if: ${{ always() && vars.QA_HOSTING_DEPLOY_ENABLED == 'true' }}
        run: node scripts/qa/campaign-control.mjs release

      - name: Scan QA evidence for secret values
        id: evidence_scan
        if: ${{ always() && vars.QA_HOSTING_DEPLOY_ENABLED == 'true' }}
        run: node scripts/qa/scan-evidence-secrets.mjs coverage playwright-report test-results

      - name: Upload sanitized QA evidence
        if: ${{ always() && vars.QA_HOSTING_DEPLOY_ENABLED == 'true' && steps.evidence_scan.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: qa-hosting-manual-evidence
          path: |
            coverage/
            playwright-report/
            test-results/
            !test-results/auth/**
            !test-results/qa-fixtures.json
            !test-results/firebase.qa.json
            !test-results/**/error-context.md
          retention-days: 7
