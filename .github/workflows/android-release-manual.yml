name: Android release manual

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: Entorno Android que se va a compilar
        required: true
        type: choice
        options:
          - qa
          - production
      version_name:
        description: Versión SemVer sin prefijo (por ejemplo, 1.0.0)
        required: true
        type: string
      version_code:
        description: Entero Android estrictamente creciente
        required: true
        type: number
      publish_release:
        description: Publicar una GitHub Release productiva
        required: true
        default: false
        type: boolean
      release_notes:
        description: Notas públicas de la versión
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: android-release-${{ inputs.flavor }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_VERSION_NAME: ${{ inputs.version_name }}
      ANDROID_VERSION_CODE: ${{ inputs.version_code }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Validar parámetros de publicación
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$ANDROID_VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "version_name debe ser SemVer estable (X.Y.Z)." >&2
            exit 1
          fi
          if [[ ! "$ANDROID_VERSION_CODE" =~ ^[1-9][0-9]*$ ]]; then
            echo "version_code debe ser un entero positivo." >&2
            exit 1
          fi
          if [[ "${{ inputs.publish_release }}" == "true" && "${{ inputs.flavor }}" != "production" ]]; then
            echo "Solo production puede publicar una GitHub Release." >&2
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Instalar dependencias
        run: npm ci

      - name: Restaurar materiales Android del entorno
        shell: bash
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/memoria-bibliografica-release.jks
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          GOOGLE_SERVICES_QA_BASE64: ${{ secrets.ANDROID_GOOGLE_SERVICES_QA_BASE64 }}
          GOOGLE_SERVICES_PRODUCTION_BASE64: ${{ secrets.ANDROID_GOOGLE_SERVICES_PRODUCTION_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          echo "ANDROID_KEYSTORE_PATH=$ANDROID_KEYSTORE_PATH" >> "$GITHUB_ENV"

          if [[ "${{ inputs.flavor }}" == "qa" ]]; then
            test -n "$GOOGLE_SERVICES_QA_BASE64"
            mkdir -p android/app/src/qa
            printf '%s' "$GOOGLE_SERVICES_QA_BASE64" | base64 --decode > android/app/src/qa/google-services.json
          else
            test -n "$GOOGLE_SERVICES_PRODUCTION_BASE64"
            mkdir -p android/app/src/production
            printf '%s' "$GOOGLE_SERVICES_PRODUCTION_BASE64" | base64 --decode > android/app/src/production/google-services.json
          fi

      - name: Construir frontend nativo
        run: npm run build:native:${{ inputs.flavor }}

      - name: Construir APK universal firmada
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          flavor_task="${{ inputs.flavor }}"
          flavor_task="${flavor_task^}"
          ./gradlew "assemble${flavor_task}Release" --no-daemon

      - name: Verificar firma y preparar artefactos
        id: artifacts
        shell: bash
        run: |
          set -euo pipefail
          source_apk="android/app/build/outputs/apk/${{ inputs.flavor }}/release/app-${{ inputs.flavor }}-release.apk"
          artifact_base="memoria-bibliografica-${{ inputs.version_name }}"
          mkdir -p artifacts
          cp "$source_apk" "artifacts/${artifact_base}.apk"
          apksigner_path="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          "$apksigner_path" verify --verbose --print-certs "artifacts/${artifact_base}.apk"
          sha256sum "artifacts/${artifact_base}.apk" > "artifacts/${artifact_base}.apk.sha256"
          echo "artifact_base=$artifact_base" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: memoria-bibliografica-${{ inputs.flavor }}-${{ inputs.version_name }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14

      - name: Publicar GitHub Release
        if: ${{ inputs.publish_release && inputs.flavor == 'production' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          set -euo pipefail
          tag="android-v${{ inputs.version_name }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "La release $tag ya existe; no se sobrescribe." >&2
            exit 1
          fi
          latest_android="$(gh release list --limit 100 --json tagName,body \
            --jq '[.[] | select(.tagName | startswith("android-v"))][0] // empty')"
          if [[ -n "$latest_android" ]]; then
            latest_tag="$(jq -r '.tagName' <<<"$latest_android")"
            latest_version="${latest_tag#android-v}"
            greatest_version="$(printf '%s\n%s\n' "$latest_version" "$ANDROID_VERSION_NAME" | sort -V | tail -n 1)"
            if [[ "$greatest_version" != "$ANDROID_VERSION_NAME" || "$latest_version" == "$ANDROID_VERSION_NAME" ]]; then
              echo "La versión $ANDROID_VERSION_NAME no es posterior a $latest_version." >&2
              exit 1
            fi
            latest_code="$(jq -r '.body' <<<"$latest_android" | sed -n 's/^- versionCode: \([0-9][0-9]*\)$/\1/p' | head -n 1)"
            if [[ -n "$latest_code" && "$ANDROID_VERSION_CODE" -le "$latest_code" ]]; then
              echo "versionCode $ANDROID_VERSION_CODE debe superar $latest_code." >&2
              exit 1
            fi
          fi
          notes_file="$RUNNER_TEMP/android-release-notes.md"
          {
            printf '%s\n\n' "${RELEASE_NOTES:-Actualización de Memoria Bibliográfica para Android.}"
            printf '%s\n' "- versionCode: $ANDROID_VERSION_CODE"
            printf '%s\n' "- APK universal firmada y checksum SHA-256 adjunto."
          } > "$notes_file"
          gh release create "$tag" artifacts/* \
            --title "Memoria Bibliográfica ${{ inputs.version_name }}" \
            --notes-file "$notes_file" \
            --target "$GITHUB_SHA"
