name: APK nativa (publicación)

# La APK nativa de producción, firmada con la clave de siempre (la de la APK de Capacitor, para instalarse encima).
# Deja la APK y su .sha256 como artefacto: la sirve la plataforma (ecosistema-kit/APK.md, «Publicar una versión de tu
# APK»). La primera versión la publica el propietario desde la administración; las siguientes,
# herramientas/publicar_apk.py con la credencial de publicación. Sin GitHub Release.

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: Versión SemVer sin prefijo (por ejemplo, 2.0.0)
        required: true
        type: string
      version_code:
        description: Entero Android estrictamente creciente (mayor * 10000 + menor * 100 + arreglo)
        required: true
        type: number

permissions:
  contents: read

concurrency:
  group: android-nativa-publicacion
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-nativa
        shell: bash
    env:
      VERSION_NAME: ${{ inputs.version_name }}
      VERSION_CODE: ${{ inputs.version_code }}
    steps:
      - uses: actions/checkout@v4

      - name: Validar la versión
        run: |
          set -euo pipefail
          if [[ ! "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "version_name debe ser SemVer estable (X.Y.Z)." >&2
            exit 1
          fi
          # La APK de Capacitor llegó a 22: la nativa empieza en 20000 (2.0.0).
          if [[ ! "$VERSION_CODE" =~ ^[1-9][0-9]*$ ]] || (( VERSION_CODE < 20000 )); then
            echo "version_code debe ser un entero de 20000 en adelante." >&2
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Restaurar la firma y el Firebase de la plataforma
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_SERVICES_PRODUCCION_BASE64: ${{ secrets.ANDROID_NATIVA_GOOGLE_SERVICES_PRODUCCION_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_PASSWORD"
          test -n "$GOOGLE_SERVICES_PRODUCCION_BASE64"
          mkdir -p .runtime/firma .runtime/plataforma
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > .runtime/firma/libros-publicacion.jks
          # app/build.gradle.kts, datosDeFirma(): el almacén y sus contraseñas, en .runtime/firma/.
          {
            printf 'storeFile=libros-publicacion.jks\n'
            printf 'storePassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
          } > .runtime/firma/libros-publicacion.properties
          printf '%s' "$GOOGLE_SERVICES_PRODUCCION_BASE64" | base64 --decode > .runtime/plataforma/google-services.produccion.json

      - name: Pruebas y APK de producción
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:testQaDebugUnitTest :app:assembleProduccionRelease \
            -PversionCode="$VERSION_CODE" -PversionName="$VERSION_NAME" --no-daemon

      - name: Comprobar la firma y preparar el artefacto
        run: |
          set -euo pipefail
          origen="app/build/outputs/apk/produccion/release/app-produccion-release.apk"
          base="libros-$VERSION_NAME"
          mkdir -p ../artefactos
          cp "$origen" "../artefactos/$base.apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          "$apksigner" verify --verbose --print-certs "../artefactos/$base.apk" | tee firma.txt
          # La huella tiene que ser la de producción que publica la web de Libros (App Links y la APK de siempre).
          esperada="$(curl -fsS https://libros.yosiftware.es/.well-known/assetlinks.json \
            | jq -r '.[] | select(.target.package_name == "es.yosiftware.libros") | .target.sha256_cert_fingerprints[0]' \
            | tr -d ':' | tr 'A-F' 'a-f')"
          # «Signer #1 certificate…» o, con minSdk 26 (solo el esquema v2), «V2 Signer: certificate…».
          obtenida="$(sed -n 's/^.*[Ss]igner.*certificate SHA-256 digest: //p' firma.txt | head -n 1)"
          if [[ -z "$esperada" || "$esperada" != "$obtenida" ]]; then
            echo "La huella de la firma ($obtenida) no es la de producción ($esperada)." >&2
            exit 1
          fi
          (cd ../artefactos && sha256sum "$base.apk" > "$base.apk.sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: libros-${{ inputs.version_name }}
          path: artefactos/*
          if-no-files-found: error
          retention-days: 14
