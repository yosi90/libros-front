name: Hosting storage cleanup

# Libera cuota de Firebase Hosting borrando versiones antiguas que ya no están
# publicadas en ningún canal. Por defecto es un simulacro.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: Borrar de verdad (si no, solo lista lo que borraría)
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
      - name: Limpiar versiones
        env:
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_YOSIFTWARE_LIBROS }}
        run: node scripts/hosting/cleanup-versions.mjs yosiftware-libros ${{ inputs.apply && '--apply' || '' }}
