name: RTF RichEdit compatibility

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic_fixtures:
    name: RichEdit fixtures in Chromium and Firefox
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          cache: npm

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install dependencies
        run: npm ci

      - name: Install browser binaries
        run: npx playwright install chromium firefox

      - name: Compare synthetic RTF fixtures
        run: npm run qa:rtf:fixtures

      - name: Upload content-free comparison report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: rtf-rich-edit-fixtures
          path: test-results/rtf-interop/fixtures-report.json
          if-no-files-found: ignore
          retention-days: 7
