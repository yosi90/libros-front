# Versiones exactas, las mismas que 3.5 Companion y Yosircana, que ya compilan con ellas en este servidor. Ninguna
# librería envía datos fuera del móvil: no hay analítica, publicidad ni informes de fallos. OkHttp solo hace las
# llamadas de la app (la API de Libros, la plataforma y las portadas) y Coil solo descarga y guarda las portadas.

[versions]
agp = "9.3.2"
kotlin = "2.3.21"
composeBom = "2026.09.00"
activityCompose = "1.13.0"
coreKtx = "1.17.0"
lifecycle = "2.11.0"
window = "1.5.1"
junit = "4.13.2"
# La misma OkHttp que la librería de la sesión (yosiftware-sesion/build.gradle.kts).
okhttp = "5.5.0"
coroutines = "1.10.2"
coil = "3.3.0"
orgJson = "20260814"

[libraries]
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
window = { group = "androidx.window", name = "window", version.ref = "window" }
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-network = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil" }
# Solo en las pruebas de la JVM.
mockwebserver = { group = "com.squareup.okhttp3", name = "mockwebserver3", version.ref = "okhttp" }
coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
# Android trae su propio org.json, pero en las pruebas de la JVM es un esqueleto vacío.
org-json = { group = "org.json", name = "json", version.ref = "orgJson" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
