org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
# La carpeta del repositorio en este servidor lleva tilde («Memoria bibliográfica»): el SDK compila bien con ella. Las
# pruebas de la JVM necesitan además el arreglo de app/build.gradle.kts («La tilde de la carpeta»).
android.overridePathCheck=true
