org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
# La carpeta del repositorio en este servidor lleva tilde («Memoria bibliográfica»): el SDK compila bien con ella. Las
# pruebas de la JVM necesitan además el arreglo de app/build.gradle.kts («La tilde de la carpeta»).
android.overridePathCheck=true
# El servidor se apaga solo ante un pico de carga repentino (propietario, 2026-10-25): como mucho dos tareas a la vez,
# sin proyectos en paralelo, y el compilador de Kotlin dentro del propio demonio de Gradle en lugar de uno aparte.
org.gradle.workers.max=2
org.gradle.parallel=false
kotlin.compiler.execution.strategy=in-process
