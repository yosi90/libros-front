/verify:
  get:
    operationId: getVerify
    tags:
    - Health
    summary: Comprueba disponibilidad agregada de la API y sus componentes
    description: "Publico y sin secretos. ReleaseId y SourceDirty identifican el checkout servido; una campana QA contractual exige SourceDirty=false. Componentes: la API, SQL Server y el lector del feed de cambios de la plataforma (plataformaFeedWorker); el tiempo real propio, la proyeccion de Firestore, el push y la retencion se retiraron con la adhesion a Yosiftware. 200 puede incluir EstadoGeneral=degraded cuando API y SQL Server funcionan pero el lector del feed no late. 503 indica que SQL Server no esta disponible para la API."
    security: []
    responses:
      '200':
        description: API y SQL Server disponibles; revisar EstadoGeneral y Componentes para degradacion parcial.
        content:
          application/json:
            schema:
              $ref: '../../openapi.yaml#/components/schemas/OperationalHealthResponse'
      '503':
        description: La API no puede conectar con SQL Server
        content:
          application/json:
            schema:
              $ref: '../../openapi.yaml#/components/schemas/OperationalHealthUnavailableResponse'
/health:
  get:
    operationId: getHealth
    tags:
    - Health
    summary: Comprueba el proceso HTTP de la API
    description: Liveness minimo; no comprueba SQL Server ni el lector del feed.
    security: []
    responses:
      '200':
        description: Proceso HTTP disponible
        content:
          application/json:
            schema:
              type: object
              required: [success, service, releaseId, sourceDirty]
              properties:
                success: {type: boolean, const: true}
                service: {type: string, example: libros-api}
                releaseId: {type: string, example: ff6751a7490bdec126c712f0b4fcfc104403834a}
                sourceDirty: {type: [boolean, 'null']}
