/runtime-config:
  get:
    operationId: getRuntimeConfig
    tags: [RuntimeConfig]
    summary: Obtiene configuracion publica del cliente por entorno
    security: []
    responses:
      '200':
        description: Configuracion publica; no contiene secretos administrativos ni tokens.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              description: La configuracion de Firebase y del WebSocket propio se retiro con la adhesion a Yosiftware; la sesion, el tiempo real y el push son del SDK de la plataforma.
              required: [success, Environment, QaDatasetVersion]
              properties:
                success: {type: boolean, const: true}
                Environment: {type: string, enum: [local, qa, produccion]}
                QaDatasetVersion: {type: [string, 'null']}
