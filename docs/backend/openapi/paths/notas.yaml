/notas:
  get:
    operationId: getNotas
    tags:
    - Notas
    summary: Lista las notas propias de libros de la biblioteca
    responses:
      '401': {$ref: '../../openapi.yaml#/components/responses/Unauthorized'}
      '200':
        description: Lista de notas
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../../openapi.yaml#/components/schemas/Note'
  post:
    operationId: postNotas
    tags:
    - Notas
    summary: Crea una nota propia en un libro de la biblioteca
    description: Requiere JWT. Fecha e indice se asignan en el servidor.
    requestBody:
      $ref: '../../openapi.yaml#/components/requestBodies/NoteCreate'
    responses:
      '401': {$ref: '../../openapi.yaml#/components/responses/Unauthorized'}
      '400': {$ref: '../../openapi.yaml#/components/responses/BadRequest'}
      '404': {$ref: '../../openapi.yaml#/components/responses/NotFound'}
      '201':
        description: Nota creada
        content:
          application/json:
            schema:
              $ref: '../../openapi.yaml#/components/schemas/Note'
  patch:
    operationId: patchNotas
    tags:
    - Notas
    summary: Actualiza una nota propia
    description: Solo cambia Nombre o Descripcion. Fecha y LibroId son inmutables.
    requestBody:
      $ref: '../../openapi.yaml#/components/requestBodies/NoteUpdate'
    responses:
      '401': {$ref: '../../openapi.yaml#/components/responses/Unauthorized'}
      '400': {$ref: '../../openapi.yaml#/components/responses/BadRequest'}
      '404': {$ref: '../../openapi.yaml#/components/responses/NotFound'}
      '200':
        description: Nota actualizada
        content:
          application/json:
            schema:
              $ref: '../../openapi.yaml#/components/schemas/Note'
/notas/libro/{id_libro}:
  get:
    operationId: getNotasLibroByIdLibro
    tags:
    - Notas
    summary: Lista solo las notas propias de un libro de la biblioteca
    parameters:
    - $ref: '../../openapi.yaml#/components/parameters/IdLibro'
    responses:
      '401': {$ref: '../../openapi.yaml#/components/responses/Unauthorized'}
      '404': {$ref: '../../openapi.yaml#/components/responses/NotFound'}
      '200':
        description: Lista de notas
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../../openapi.yaml#/components/schemas/Note'
/notas/{id_nota}:
  delete:
    operationId: deleteNotasByIdNota
    tags:
    - Notas
    summary: Elimina una nota propia de un libro de la biblioteca
    parameters:
    - name: id_nota
      in: path
      required: true
      schema:
        type: integer
    responses:
      '401': {$ref: '../../openapi.yaml#/components/responses/Unauthorized'}
      '404': {$ref: '../../openapi.yaml#/components/responses/NotFound'}
      '200':
        $ref: '../../openapi.yaml#/components/responses/Deleted'
