/coleccion/antologias/{id_antologia}/secciones/{id_libro}:
  get:
    operationId: getColeccionAntologiaSeccionContexto
    tags:
    - Coleccion
    summary: Consulta estado, puntuacion y resena contextuales de una seccion
    description: La antologia debe estar en la coleccion del usuario y la pareja antologia-libro debe existir. No crea ni proyecta un libro independiente.
    parameters:
    - $ref: '../../openapi.yaml#/components/parameters/IdAntologia'
    - $ref: '../../openapi.yaml#/components/parameters/IdLibro'
    responses:
      '200':
        description: Contexto personal de lectura de la seccion
        content:
          application/json:
            schema:
              $ref: '../../openapi.yaml#/components/schemas/AnthologySectionCollectionContext'
      '401':
        $ref: '../../openapi.yaml#/components/responses/Unauthorized'
      '404':
        description: Antologia no guardada (`anthology_not_in_collection`) o relacion invalida (`anthology_section_relation_not_found`).
        content: {application/json: {schema: {$ref: '../../openapi.yaml#/components/schemas/ErrorResponse'}}}
  patch:
    operationId: patchColeccionAntologiaSeccionContexto
    tags:
    - Coleccion
    summary: Actualiza estado, puntuacion o resena contextuales de una seccion
    description: EstadoId agrega un historico; Puntuacion y Resena admiten escritura conjunta y null las limpia. La mutacion no crea usuario_libros, actividad social ni una proyeccion independiente.
    parameters:
    - $ref: '../../openapi.yaml#/components/parameters/IdAntologia'
    - $ref: '../../openapi.yaml#/components/parameters/IdLibro'
    requestBody:
      $ref: '../../openapi.yaml#/components/requestBodies/AnthologySectionContextWrite'
    responses:
      '200':
        description: Contexto completo resultante para reconciliacion
        content:
          application/json:
            schema:
              $ref: '../../openapi.yaml#/components/schemas/AnthologySectionCollectionUpdated'
      '400':
        $ref: '../../openapi.yaml#/components/responses/BadRequest'
      '401':
        $ref: '../../openapi.yaml#/components/responses/Unauthorized'
      '404':
        description: Antologia no guardada (`anthology_not_in_collection`) o relacion invalida (`anthology_section_relation_not_found`).
        content: {application/json: {schema: {$ref: '../../openapi.yaml#/components/schemas/ErrorResponse'}}}
