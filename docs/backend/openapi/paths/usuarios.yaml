/usuarios/me:
  get:
    operationId: getCurrentLocalUser
    tags: [Usuarios]
    summary: Devuelve el usuario local de Libros de la cuenta de Yosiftware autenticada
    description: >-
      Sustituye a `GET /auth/user`. La cuenta, el perfil, el avatar y el correo son de la plataforma
      (`yosiftware.sesion()` y `/v1/personas`); Libros solo devuelve su `Id` local, el alias que copia el
      feed de cambios en `Nombre` y el rol de Libros. La primera petición de una cuenta nueva crea su usuario
      local vacío con un nombre provisional hasta que llega el alias por el feed. Exenta de `normasPendientes`
      para que la web pueda arrancar. Respuesta `private, no-store`.
    responses:
      '200':
        description: Usuario local de la cuenta autenticada.
        headers:
          Cache-Control: {schema: {type: string, const: 'private, no-store'}}
        content:
          application/json:
            schema:
              type: object
              required: [success, user]
              properties:
                success: {type: boolean, const: true}
                user:
                  type: object
                  required: [Id, Nombre, Role, CompartirEstadisticas]
                  properties:
                    Id: {type: integer, minimum: 1}
                    Nombre: {type: string, description: Alias de la cuenta copiado por el feed de cambios.}
                    Role:
                      $ref: '../../openapi.yaml#/components/schemas/IdName'
                    CompartirEstadisticas:
                      type: boolean
                      description: Si sus lecturas cuentan, anónimas, en las estadísticas de la comunidad (`PUT /usuarios/me/estadisticas-comunidad`).
            example:
              success: true
              user: {Id: 1, Nombre: yosi, Role: {Id: 2, Nombre: administrador}, CompartirEstadisticas: false}
      '401':
        $ref: '../../openapi.yaml#/components/responses/Unauthorized'
      '404':
        $ref: '../../openapi.yaml#/components/responses/NotFound'
/usuarios/me/estadisticas-comunidad:
  put:
    operationId: setCommunityStatisticsConsent
    tags: [Usuarios]
    summary: Decide si las lecturas propias cuentan en las estadísticas de la comunidad
    description: >-
      Un ajuste de Libros, distinto de «ocultar que uso la web» de la plataforma (`<yosi-privacidad>`). Con
      `Compartir: true`, las lecturas de la persona cuentan, anónimas y con el umbral de privacidad, en
      `GET /estadisticas/comunidad` y en la «Comunidad lectora» de los detalles públicos. Por defecto no cuentan.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [Compartir]
            properties:
              Compartir: {type: boolean}
    responses:
      '200':
        description: Preferencia guardada.
        content:
          application/json:
            schema:
              type: object
              required: [success, CompartirEstadisticas]
              properties:
                success: {type: boolean, const: true}
                CompartirEstadisticas: {type: boolean}
      '400':
        $ref: '../../openapi.yaml#/components/responses/BadRequest'
      '401':
        $ref: '../../openapi.yaml#/components/responses/Unauthorized'
