/catalogo/sagas/{id}/detalle-publico:
  get:
    operationId: getCatalogoSagaDetallePublico
    tags: [Catalogo]
    summary: Detalle publico de una saga canonica
    description: Incluye relaciones directas, familia, orden de lectura, universo y autores. Disponible aunque la saga no este en la coleccion.
    parameters: [{name: id, in: path, required: true, schema: {type: integer, minimum: 1}}]
    responses:
      '200':
        description: Detalle de saga
        content:
          application/json:
            schema: {$ref: '../../openapi.yaml#/components/schemas/SagaCatalogDetail'}
      '401': {$ref: '../../openapi.yaml#/components/responses/Unauthorized'}
      '404': {$ref: '../../openapi.yaml#/components/responses/NotFound'}
