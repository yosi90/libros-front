/antologias:
  get:
    operationId: getAntologias
    tags:
    - Antologias
    summary: Lista antologias
    responses:
      '401': {$ref: '../../openapi.yaml#/components/responses/Unauthorized'}
      '200':
        description: Lista de antologias
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../../openapi.yaml#/components/schemas/Anthology'
/antologias/{id_antologia}:
  get:
    operationId: getAntologiasByIdAntologia
    tags:
    - Antologias
    summary: Detalle lector de antologia en la coleccion propia
    description: En esquemas anteriores sin tablas contextuales de secciones, usa el historial y coleccion de libros de la cuenta.
    parameters:
    - $ref: '../../openapi.yaml#/components/parameters/IdAntologia'
    responses:
      '401': {$ref: '../../openapi.yaml#/components/responses/Unauthorized'}
      '200':
        description: Antologia
        content:
          application/json:
            schema:
              $ref: '../../openapi.yaml#/components/schemas/Anthology'
/antologias/leidos:
  get:
    operationId: getAntologiasLeidos
    tags:
    - Antologias
    summary: Cuenta antologias leidas
    responses:
      '401': {$ref: '../../openapi.yaml#/components/responses/Unauthorized'}
      '200':
        $ref: '../../openapi.yaml#/components/responses/MetricObject'
/antologias/no_leidos:
  get:
    operationId: getAntologiasNoLeidos
    tags:
    - Antologias
    summary: Cuenta antologias no leidas
    responses:
      '401': {$ref: '../../openapi.yaml#/components/responses/Unauthorized'}
      '200':
        $ref: '../../openapi.yaml#/components/responses/MetricObject'
/antologias/secciones/leidas:
  get:
    operationId: getAntologiasSeccionesLeidas
    tags:
    - Antologias
    summary: Cuenta secciones leidas
    description: Cuenta secciones de antologias en la coleccion cuyo ultimo estado es leido. Devuelve cero si no hay ninguna; admite el historial anterior de instalaciones sin estados contextuales.
    responses:
      '401': {$ref: '../../openapi.yaml#/components/responses/Unauthorized'}
      '200':
        $ref: '../../openapi.yaml#/components/responses/MetricObject'
/antologias/secciones/{id_libro}:
  get:
    operationId: getAntologiasSeccionesByIdLibro
    tags:
    - Antologias
    summary: Detalle de seccion de antologia
    parameters:
    - $ref: '../../openapi.yaml#/components/parameters/IdLibro'
    responses:
      '401': {$ref: '../../openapi.yaml#/components/responses/Unauthorized'}
      '200':
        description: Seccion
        content:
          application/json:
            schema:
              $ref: '../../openapi.yaml#/components/schemas/AnthologySectionDetail'
