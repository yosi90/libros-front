/qa/status:
  get:
    operationId: getQaStatus
    tags: [QA]
    summary: Publica el semaforo operativo de una campana QA
    description: Solo se registra en QA, requiere el secreto de automatizacion y no permite CORS. La lease opcional solo se compara; nunca se devuelve su ID, propietario o RunId. La identidad de despliegue no bloquea las capacidades Reset y Cleanup de una lease valida.
    parameters:
    - $ref: '../../openapi.yaml#/components/parameters/QaResetToken'
    - $ref: '../../openapi.yaml#/components/parameters/QaOptionalLeaseHeader'
    responses:
      '200':
        description: Semaforo QA tipado.
        content:
          application/json:
            schema: {$ref: '../../openapi.yaml#/components/schemas/QaStatusResponse'}
            examples:
              ready:
                value:
                  success: true
                  Environment: qa
                  DatasetVersion: 2026.08.2
                  Status: ready
                  Reasons: []
                  Scenario: {Active: baseline, ResetInProgress: false}
                  Lease: {Active: false, CallerState: absent}
                  Capabilities: {BeginCampaign: allowed, ContinueCampaign: blocked, Reset: blocked, Cleanup: not-needed}
                  Deployment:
                    Api: {ReleaseId: 0d5d6c92e08e76b4b282b8f8cbd54aa57d768439, SourceDirty: false}
                    RealtimeGateway: {Status: healthy, ReleaseId: 0d5d6c92e08e76b4b282b8f8cbd54aa57d768439, SourceDirty: false}
                  Components:
                    SqlServer: {Status: healthy}
                    Nats: {Status: healthy}
                    RealtimeGateway: {Status: healthy}
                    OutboxRelay: {Status: healthy}
                    FirestoreProjectionWorker: {Status: healthy}
                    PushWorker: {Status: healthy}
                    RetentionWorker: {Status: healthy}
              degraded:
                value:
                  success: true
                  Environment: qa
                  DatasetVersion: 2026.08.2
                  Status: degraded
                  Reasons: [gateway_source_dirty_or_unknown, component_degraded]
                  Scenario: {Active: realtime-recovery, ResetInProgress: false}
                  Lease: {Active: true, CallerState: active}
                  Capabilities: {BeginCampaign: blocked, ContinueCampaign: allowed, Reset: allowed, Cleanup: allowed}
                  Deployment:
                    Api: {ReleaseId: 0d5d6c92e08e76b4b282b8f8cbd54aa57d768439, SourceDirty: false}
                    RealtimeGateway: {Status: degraded, ReleaseId: 0d5d6c92e08e76b4b282b8f8cbd54aa57d768439, SourceDirty: null}
                  Components:
                    SqlServer: {Status: healthy}
                    Nats: {Status: healthy}
                    RealtimeGateway: {Status: degraded}
                    OutboxRelay: {Status: healthy}
                    FirestoreProjectionWorker: {Status: healthy}
                    PushWorker: {Status: healthy}
                    RetentionWorker: {Status: healthy}
              blocked:
                value:
                  success: true
                  Environment: qa
                  DatasetVersion: 2026.08.2
                  Status: blocked
                  Reasons: [reset_in_progress]
                  Scenario: {Active: rate-limited, ResetInProgress: true}
                  Lease: {Active: true, CallerState: active}
                  Capabilities: {BeginCampaign: blocked, ContinueCampaign: blocked, Reset: retry, Cleanup: retry}
                  Deployment:
                    Api: {ReleaseId: 0d5d6c92e08e76b4b282b8f8cbd54aa57d768439, SourceDirty: false}
                    RealtimeGateway: {Status: healthy, ReleaseId: 0d5d6c92e08e76b4b282b8f8cbd54aa57d768439, SourceDirty: false}
                  Components:
                    SqlServer: {Status: healthy}
                    Nats: {Status: healthy}
                    RealtimeGateway: {Status: healthy}
                    OutboxRelay: {Status: healthy}
                    FirestoreProjectionWorker: {Status: healthy}
                    PushWorker: {Status: healthy}
                    RetentionWorker: {Status: healthy}
      '401': {description: Token QA ausente o invalido., content: {application/json: {schema: {$ref: '../../openapi.yaml#/components/schemas/QaStatusError'}}}}
      '404': {description: Las herramientas QA no estan habilitadas., content: {application/json: {schema: {$ref: '../../openapi.yaml#/components/schemas/QaStatusError'}}}}
      '503': {description: El semaforo no puede confirmar SQL o la marca positiva QA., content: {application/json: {schema: {$ref: '../../openapi.yaml#/components/schemas/QaStatusError'}}}}
/qa/fixtures:
  get:
    operationId: getQaFixtures
    tags: [QA]
    summary: Resuelve aliases del dataset QA activo
    description: Solo se registra en QA. Requiere un secreto de automatizacion y no permite CORS.
    parameters:
    - $ref: '../../openapi.yaml#/components/parameters/QaResetToken'
    - $ref: '../../openapi.yaml#/components/parameters/QaLeaseHeader'
    responses:
      '200': {$ref: '../../openapi.yaml#/components/responses/QaFixturesResponse'}
      '401': {$ref: '../../openapi.yaml#/components/responses/QaUnauthorized'}
      '404': {$ref: '../../openapi.yaml#/components/responses/QaUnavailable'}
      '503': {$ref: '../../openapi.yaml#/components/responses/QaUnavailable'}
/qa/reset:
  post:
    operationId: resetQaDataset
    tags: [QA]
    summary: Restaura de forma serializada el baseline QA y aplica un perfil cerrado
    description: Solo CI u operadores QA. Nunca existe en produccion ni se llama desde JavaScript del navegador.
    parameters:
    - $ref: '../../openapi.yaml#/components/parameters/QaResetToken'
    - $ref: '../../openapi.yaml#/components/parameters/QaLeaseHeader'
    requestBody:
      required: false
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              Scenario:
                type: string
                enum: [baseline, version-conflict, expired-sessions, rate-limited, realtime-recovery]
                default: baseline
    responses:
      '200': {$ref: '../../openapi.yaml#/components/responses/QaResetResponse'}
      '400': {description: Escenario o cuerpo QA invalido.}
      '401': {$ref: '../../openapi.yaml#/components/responses/QaUnauthorized'}
      '404': {$ref: '../../openapi.yaml#/components/responses/QaUnavailable'}
      '409': {description: Ya hay un reset serializado en curso.}
      '503': {$ref: '../../openapi.yaml#/components/responses/QaUnavailable'}
/qa/lease/acquire:
  post:
    operationId: acquireQaLease
    tags: [QA]
    summary: Adquiere la exclusion global para una campaña QA
    description: Una sola campaña backend, frontend o manual puede controlar el dataset. Caduca automaticamente a los diez minutos.
    parameters:
    - $ref: '../../openapi.yaml#/components/parameters/QaResetToken'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [Owner, RunId]
            properties:
              Owner: {type: string, enum: [backend-smoke, frontend-playwright, manual]}
              RunId: {type: string, minLength: 1, maxLength: 120}
    responses:
      '201': {description: Lease adquirida., content: {application/json: {schema: {$ref: '../../openapi.yaml#/components/schemas/QaLease'}}}}
      '400': {description: Owner o RunId invalido.}
      '401': {$ref: '../../openapi.yaml#/components/responses/QaUnauthorized'}
      '404': {$ref: '../../openapi.yaml#/components/responses/QaUnavailable'}
      '409': {description: Otra campaña mantiene una lease activa.}
      '503': {$ref: '../../openapi.yaml#/components/responses/QaUnavailable'}
/qa/lease/{lease_id}/renew:
  post:
    operationId: renewQaLease
    tags: [QA]
    summary: Renueva diez minutos la lease global activa
    parameters:
    - $ref: '../../openapi.yaml#/components/parameters/QaResetToken'
    - $ref: '../../openapi.yaml#/components/parameters/QaLeaseId'
    responses:
      '200': {description: Lease renovada., content: {application/json: {schema: {$ref: '../../openapi.yaml#/components/schemas/QaLease'}}}}
      '401': {$ref: '../../openapi.yaml#/components/responses/QaUnauthorized'}
      '404': {$ref: '../../openapi.yaml#/components/responses/QaUnavailable'}
      '409': {description: 'Lease inexistente, expirada o ajena.'}
      '503': {$ref: '../../openapi.yaml#/components/responses/QaUnavailable'}
/qa/lease/{lease_id}:
  delete:
    operationId: releaseQaLease
    tags: [QA]
    summary: Libera idempotentemente la lease global de la campaña
    parameters:
    - $ref: '../../openapi.yaml#/components/parameters/QaResetToken'
    - $ref: '../../openapi.yaml#/components/parameters/QaLeaseId'
    responses:
      '200': {description: Lease liberada o repeticion idempotente., content: {application/json: {schema: {$ref: '../../openapi.yaml#/components/schemas/QaLease'}}}}
      '401': {$ref: '../../openapi.yaml#/components/responses/QaUnauthorized'}
      '404': {$ref: '../../openapi.yaml#/components/responses/QaUnavailable'}
      '409': {description: Lease inexistente o perteneciente a otra campaña.}
      '503': {$ref: '../../openapi.yaml#/components/responses/QaUnavailable'}
