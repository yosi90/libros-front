        application/json:
          schema:
            $ref: '#/components/schemas/ReportGroupResolved'
    Message:
      description: Mensaje de resultado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MessageResponse'
    Author:
      description: Autor
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Author'
    AuthorList:
      description: Lista de autores
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Author'
    MetricObject:
      description: Objeto de metrica
