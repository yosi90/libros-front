        default: 1
    CatalogPageSize:
      name: pageSize
      in: query
      required: false
      description: Maximo 100.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    ImageName:
      name: name
      in: path
      required: true
      schema:
        type: string
  requestBodies:
    OwnedEditionsWrite:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [EdicionesIds]
            properties:
              EdicionesIds:
                type: array
                uniqueItems: true
                items: {type: integer, minimum: 1}
    EditionWrite:
      required: true
      content:
        application/json:
          schema: {$ref: '#/components/schemas/EditionWrite'}
    ReadingStatusWrite:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
            - EstadoId
            properties:
              EstadoId:
                type: integer
                enum:
                - 0
                - 1
                - 2
                - 3
                - 4
                - 5
                description: 0 En espera, 1 En marcha, 2 Leido, 3 Por comprar, 4 Quiero leer, 5 Descartado.
              Fecha:
                type: [string, 'null']
                format: date-time
                description: Fecha ISO 8601 opcional del historico. Si se omite, usa la fecha del servidor.
              PublicarActividad: {type: [boolean, 'null'], description: 'false no publica la novedad de este cambio en la plataforma; true, null u omitido la publican y la plataforma aplica los ajustes de compartir de la persona.'}
    RatingWrite:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
            - Puntuacion
            properties:
              Puntuacion:
                type: integer
                minimum: 1
                maximum: 5
              Resena:
                type:
                - string
                - 'null'
                description: Opcional. Si se envia, actualiza la resena junto con la puntuacion. Null o cadena vacia la borran.
              PublicarActividad: {type: [boolean, 'null'], description: 'false no publica la novedad de este cambio en la plataforma; true, null u omitido la publican y la plataforma aplica los ajustes de compartir de la persona.'}
    ReviewWrite:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
            - Resena
            properties:
              Resena:
                type:
                - string
                - 'null'
                description: Null o cadena vacia borran la resena.
              PublicarActividad: {type: [boolean, 'null'], description: 'false no publica la novedad de este cambio en la plataforma; true, null u omitido la publican y la plataforma aplica los ajustes de compartir de la persona.'}
    AnthologySectionContextWrite:
      required: true
      content:
        application/json:
          schema:
            type: object
            minProperties: 1
            properties:
              EstadoId:
                type: integer
                enum: [0, 1, 2, 3, 4, 5]
                description: Si se envia, crea un nuevo historico de estado para la seccion.
              Fecha:
                type: [string, 'null']
                format: date-time
                description: Solo se admite junto con EstadoId; si se omite, usa la fecha del servidor.
              Puntuacion:
                type: [integer, 'null']
                minimum: 1
                maximum: 5
                description: Null limpia la puntuacion contextual.
              Resena:
                type: [string, 'null']
                description: Null o cadena vacia limpian la resena contextual privada.
    CatalogRequestCreate:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CatalogRequestCreate'
    CatalogRequestResolve:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CatalogRequestResolve'
