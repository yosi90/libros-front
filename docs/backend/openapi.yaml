components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token de la cuenta de Yosiftware (ES256, audiencia libros-api), el que da el SDK de la plataforma.
    notificappUpstreamAuth:
      type: http
      scheme: bearer
      description: Token privado de servidor a servidor, distinto del JWT y del emisor de avisos.
    adminPluginCredential:
      type: http
      scheme: bearer
      description: >-
        Credencial del plugin de Libros en la administración de la plataforma. La API solo guarda su huella SHA-256
        (`LIBROS_PLUGIN_ADMIN_CREDENCIAL_SHA256`). Solo se acepta por la propia máquina.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: La pone la administración en cada acción `POST`. Repetirla devuelve la respuesta guardada (`Idempotent-Replayed`) sin repetir el cambio; con otra petición es `409 idempotency_key_conflict`.
      schema: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'}
    PluginCatalogType:
      name: tipo
      in: query
      required: true
      schema: {type: string, enum: [libro, antologia, autor, universo, saga, idioma, estilo, lugar-origen, estado-localizacion]}
    QaResetToken:
      name: X-QA-Reset-Token
      in: header
      required: true
      description: Secreto rotatorio de automatizacion; solo valido en el host QA.
      schema:
        type: string
    QaLeaseHeader:
      name: X-QA-Lease-Id
      in: header
      required: true
      description: Lease global activa adquirida por la campaña que solicita el reset.
      schema:
        type: string
        format: uuid
    QaOptionalLeaseHeader:
      name: X-QA-Lease-Id
      in: header
      required: false
      description: Lease de la campana llamante; permite calcular capacidades sin revelar su identidad.
      schema:
        type: string
        format: uuid
    QaLeaseId:
      name: lease_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdAutor:
      name: id_autor
      in: path
      required: true
      schema:
        type: integer
    IdUniverso:
      name: id_universo
      in: path
      required: true
      schema:
        type: integer
    IdSaga:
      name: id_saga
      in: path
      required: true
      schema:
        type: integer
    IdLibro:
      name: id_libro
      in: path
      required: true
      schema:
        type: integer
    IdPersonaje:
      name: id_personaje
      in: path
      required: true
      schema:
        type: integer
    IdOrganizacion:
      name: id_organizacion
      in: path
      required: true
      schema:
        type: integer
    IdLocalizacion:
      name: id_localizacion
      in: path
      required: true
      schema:
        type: integer
    IdConcepto:
      name: id_concepto
      in: path
      required: true
      schema:
        type: integer
    IdEvento:
      name: id_evento
      in: path
      required: true
      schema:
        type: integer
    IdCita:
      name: id_cita
      in: path
      required: true
      schema:
        type: integer
    IdApodo:
      name: id_apodo
      in: path
      required: true
      schema:
        type: integer
    IdRelacionPersonaje:
      name: id_relacion
      in: path
      required: true
