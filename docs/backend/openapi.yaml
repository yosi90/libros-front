        Carpeta: {type: string, const: .runtime/copias}
        EnCurso: {type: boolean}
        Ultima: {type: [object, 'null'], properties: {Estado: {type: string, enum: [correcta, fallida]}, Archivo: {type: [string, 'null']}, Bytes: {type: [integer, 'null']}, Inicio: {type: string}, Fin: {type: [string, 'null']}}}
