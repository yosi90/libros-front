            properties:
              LocalizacionId:
                type: integer
              EstadoId:
                type: integer
              Origen:
                type: integer
    NoteCreate:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NoteCreate'
    NoteUpdate:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NoteUpdate'
    ImageUpload:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required:
            - image
            properties:
              image:
                type: string
                format: binary
  responses:
    PluginUnauthorized:
      description: 'Falta la credencial del plugin o no es la suya (`admin_plugin_unauthorized`).'
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    PluginNotLocal:
      description: 'La petición no viene de la propia máquina (túnel de Cloudflare, proxy, otra dirección u otro `Host`): la ruta no existe (`route_not_found`).'
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    PluginNotConfigured:
      description: 'Falta la huella de la credencial o la cuenta de administración (`admin_plugin_not_configured`, `admin_plugin_actor_unavailable`).'
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    EditionSaved:
      description: Edición guardada
      content:
        application/json:
          schema:
            type: object
            properties:
              Id: {type: integer}
              ISBN: {type: [string, 'null']}
              Portada: {type: string}
    QaFixturesResponse:
      description: Aliases estables del dataset QA.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/QaFixturesResponse'
    QaResetResponse:
      description: Dataset QA restaurado y perfil aplicado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/QaResetResponse'
    QaUnauthorized:
      description: Secreto QA ausente o invalido.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FlexibleObject'
    QaUnavailable:
      description: La ruta no esta registrada o la base no demuestra ser QA.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FlexibleObject'
    BadRequest:
      description: Petición inválida. Mostrar únicamente `error`; `debug` es diagnóstico.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Token ausente, invalido o sin permisos
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Token valido pero sin rol suficiente
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Conflicto de estado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ReadingStatusUpdated:
      description: Estado personal actualizado
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              Estado:
                type: object
                properties:
                  Id:
                    type: integer
                    description: Id historico de fecha_estado_libros/fecha_estado_antologias.
                  EstadoId:
                    type: integer
                    description: Id del catalogo estados_libro.
                  Nombre:
                    type: string
                  Fecha:
                    type: [string, 'null']
                    format: date-time
    RatingUpdated:
      description: Puntuacion personal actualizada
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              Puntuacion:
                type: integer
                minimum: 1
                maximum: 5
              Resena:
                type:
                - string
                - 'null'
                description: Solo aparece si se envio en la peticion.
              ResenaOculta:
                type: boolean
                description: Solo aparece si se envio Resena; indica que la nueva edicion queda visible.
    ReviewUpdated:
      description: Resena personal actualizada
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              Resena:
                type:
                - string
                - 'null'
              ResenaOculta:
                type: boolean
    CatalogRequestResolved:
      description: Peticion resuelta
