              Nombre:
                type: string
                minLength: 2
                maxLength: 100
              Pagina:
                type: integer
              PersonajeId:
                type: integer
              Entradas:
                type: array
                minItems: 1
                items:
                  $ref: '#/components/schemas/NarrativeEntryCreate'
              Descripcion:
                type: string
                minLength: 15
                description: Atajo legacy. Si no se envia Entradas, crea una unica entrada con nombre igual a Nombre.
    LocationStateWrite:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
            - LocalizacionId
            - EstadoId
            - Origen
