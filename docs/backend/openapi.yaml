        image/jpeg:
          schema:
            type: string
            format: binary
  schemas:
    SuccessResponse:
      type: object
      required: [success]
      properties:
        success: {type: boolean, const: true}
    UserSummary:
      type: object
      required: [Id, Nombre]
      properties:
        Id: {type: integer}
        Nombre: {type: string}
        Imagen: {type: [string, 'null']}
    SocialSummaryResponse:
      allOf:
      - $ref: '#/components/schemas/SuccessResponse'
      - type: object
        required: [Parcial, BloquesFallidos, Resumen]
        properties:
          Parcial: {type: boolean}
          BloquesFallidos: {type: array, items: {type: string}}
          Resumen:
            type: object
            required: [Relaciones, Clubes, Mensajes]
            properties:
              Relaciones: {type: object, required: [Amistades, SolicitudesRecibidasPendientes, Seguidores, Seguidos], properties: {Amistades: {type: integer, minimum: 0}, SolicitudesRecibidasPendientes: {type: integer, minimum: 0}, Seguidores: {type: integer, minimum: 0}, Seguidos: {type: integer, minimum: 0}}}
              Clubes: {type: object, required: [Activos, InvitacionesPendientes], properties: {Activos: {type: integer, minimum: 0}, InvitacionesPendientes: {type: integer, minimum: 0}}}
              Mensajes: {type: object, required: [NoLeidos, NoLeidosHumanos, NoLeidosSistema], properties: {NoLeidos: {type: integer, minimum: 0}, NoLeidosHumanos: {type: integer, minimum: 0}, NoLeidosSistema: {type: integer, minimum: 0}}}
    AdminUser:
      type: object
      additionalProperties: false
      description: Usuario local de Libros para la gestión de roles. El perfil, el correo y la moderación de la cuenta son de la plataforma.
      required: [Id, Nombre, Rol, EstadoCuenta, FechaRegistro, UltimaActividad]
      properties:
        Id: {type: integer}
        IdGlobal: {type: [string, 'null'], format: uuid, description: La cuenta de Yosiftware (`sub`) enlazada; los roles van por ella.}
        Nombre: {type: string, description: Alias copiado por el feed de cambios.}
        Rol: {$ref: '#/components/schemas/IdName'}
        EstadoCuenta: {$ref: '#/components/schemas/IdName'}
        FechaRegistro: {type: [string, 'null'], format: date-time}
        UltimaActividad: {type: [string, 'null'], format: date-time}
    AdminSummaryCountByCatalog:
      type: object
      additionalProperties: false
      required: [Id, Nombre, Total]
      properties:
        Id: {type: integer, minimum: 1}
        Nombre: {type: string}
        Total: {type: integer, minimum: 0}
    AdminSummaryAccounts:
      type: object
      additionalProperties: false
      required: [PorEstado, PorRol]
      properties:
        PorEstado: {type: array, items: {$ref: '#/components/schemas/AdminSummaryCountByCatalog'}}
        PorRol: {type: array, items: {$ref: '#/components/schemas/AdminSummaryCountByCatalog'}}
    AdminSummaryQueues:
      type: object
      additionalProperties: false
      required: [PeticionesCatalogo, ReportesResenas, DenunciasComunidad]
      properties:
        PeticionesCatalogo: {type: integer, minimum: 0}
        ReportesResenas: {type: integer, minimum: 0}
        DenunciasComunidad: {type: integer, minimum: 0}
    AdminSummaryResponse:
      type: object
      additionalProperties: false
      required: [success, Cuentas, Colas]
      properties:
        success: {type: boolean, const: true}
        Cuentas: {$ref: '#/components/schemas/AdminSummaryAccounts'}
        Colas: {$ref: '#/components/schemas/AdminSummaryQueues'}
    AdminUserListResponse:
      type: object
      required: [success, Usuarios, SiguienteCursor]
      properties: {success: {type: boolean}, Usuarios: {type: array, items: {$ref: '#/components/schemas/AdminUser'}}, SiguienteCursor: {type: [object, 'null']}}
    AdminAuditResponse:
      type: object
      required: [success, Registros, SiguienteCursor]
      properties: {success: {type: boolean}, Registros: {type: array, items: {type: object}}, SiguienteCursor: {type: [object, 'null']}}
    CommunitySpoilerWrite:
      type: object
      additionalProperties: false
      description: Rango de spoiler de una publicación o comentario. Requiere un LibroId propio o heredado de la publicación; los capítulos deben pertenecer a ese libro.
      properties:
        PaginaInicio: {type: number, minimum: 1}
        PaginaFin: {type: number, minimum: 1}
        CapituloInicioId: {type: integer, minimum: 1}
        CapituloFinId: {type: integer, minimum: 1}
      anyOf: [{required: [PaginaInicio]}, {required: [PaginaFin]}, {required: [CapituloInicioId]}, {required: [CapituloFinId]}]
      example: {PaginaInicio: 120, PaginaFin: 145}
    CommunitySpoiler:
      type: object
      additionalProperties: false
      required: [Oculto]
      description: Rango calculado y estado de visibilidad para el usuario autenticado. Cuando Oculto es true no se revelan las páginas ni capítulos y ContenidoMarkdown es null.
      properties:
        Oculto: {type: boolean}
        PaginaInicio: {type: number, minimum: 1}
        PaginaFin: {type: number, minimum: 1}
        CapituloInicioId: {type: integer, minimum: 1}
        CapituloFinId: {type: integer, minimum: 1}
      example: {Oculto: false, PaginaInicio: 120, PaginaFin: 145}
    CommunityPost:
      type: object
      required: [Id, ContenidoMarkdown, Autor, Audiencia, Spoiler, FechaCreacion, Comentarios, Reacciones]
      properties:
        Id: {type: integer}
        Titulo: {type: [string, 'null']}
        ContenidoMarkdown: {type: [string, 'null'], description: Es null cuando Spoiler.Oculto es true.}
        Autor: {$ref: '#/components/schemas/UserSummary'}
        ClubId: {type: [integer, 'null']}
        LibroId: {type: [integer, 'null']}
        AntologiaId: {type: [integer, 'null']}
        Audiencia: {type: string, enum: [publico, seguidores, amigos, club], description: 'Las publicaciones nuevas son siempre club; las demás quedan del muro general retirado.'}
        Spoiler: {oneOf: [{$ref: '#/components/schemas/CommunitySpoiler'}, {type: 'null'}]}
        FechaCreacion: {type: string, format: date-time}
        Comentarios: {type: integer, minimum: 0}
        Reacciones: {type: integer, minimum: 0}
    CommunityPostListResponse:
      allOf:
      - $ref: '#/components/schemas/SuccessResponse'
      - type: object
        required: [Publicaciones, SiguienteCursor]
        properties:
          Publicaciones: {type: array, items: {$ref: '#/components/schemas/CommunityPost'}}
          SiguienteCursor: {$ref: '#/components/schemas/CommunityKeysetCursor'}
    CommunityPostCreateRequest:
      type: object
      required: [ContenidoMarkdown]
      properties:
        Titulo: {type: string, maxLength: 200}
        ContenidoMarkdown: {type: string, minLength: 1, maxLength: 20000}
        LibroId: {type: integer, minimum: 1}
        AntologiaId: {type: integer, minimum: 1}
        Audiencia: {type: string, enum: [club], default: club, description: 'Solo club: el muro general se retiró.'}
        ClubId: {type: integer, minimum: 1, description: 'Opcional; si se envía, debe coincidir con el club de la ruta.'}
        Spoiler: {$ref: '#/components/schemas/CommunitySpoilerWrite'}
    CommunityPostCreateResponse:
      allOf:
      - $ref: '#/components/schemas/SuccessResponse'
      - type: object
        required: [Publicacion]
        properties:
          Publicacion:
            type: object
            required: [Id, ContenidoMarkdown, Spoiler, FechaCreacion]
            properties:
              Id: {type: integer}
              Titulo: {type: [string, 'null']}
              ContenidoMarkdown: {type: string}
              ClubId: {type: [integer, 'null']}
              LibroId: {type: [integer, 'null']}
              AntologiaId: {type: [integer, 'null']}
              Audiencia: {type: string, enum: [publico, seguidores, amigos, club]}
              Spoiler: {oneOf: [{$ref: '#/components/schemas/CommunitySpoiler'}, {type: 'null'}]}
              FechaCreacion: {type: string, format: date-time}
    CommunityPostEditRequest:
      type: object
      required: [ContenidoMarkdown]
      properties:
        Titulo: {type: [string, 'null'], maxLength: 200}
        ContenidoMarkdown: {type: string, minLength: 1, maxLength: 20000}
    CommunityMutationResponse:
      allOf:
      - $ref: '#/components/schemas/SuccessResponse'
      - type: object
        required: [Eliminada]
        properties: {Eliminada: {type: boolean}}
    ResolutionStateResponse:
      allOf:
      - $ref: '#/components/schemas/SuccessResponse'
      - type: object
        required: [Estado]
        properties: {Estado: {type: string, enum: [aceptada, rechazada]}}
    CommunityCommentCreateRequest:
      type: object
      required: [ContenidoMarkdown]
      description: Si la publicacion padre tiene spoiler, omitir Spoiler hereda su contexto y LibroId efectivo. Un spoiler explicito debe usar el mismo libro y abarcar el rango del padre; AntologiaId o un LibroId distinto se rechazan.
      properties:
        ContenidoMarkdown: {type: string, minLength: 1, maxLength: 4000}
        LibroId: {type: integer, minimum: 1}
        AntologiaId: {type: integer, minimum: 1}
        Spoiler: {$ref: '#/components/schemas/CommunitySpoilerWrite'}
    CommunityCommentEditRequest:
      type: object
      required: [ContenidoMarkdown]
      properties: {ContenidoMarkdown: {type: string, minLength: 1, maxLength: 4000}}
    CommunityKeysetCursor:
      oneOf:
      - type: 'null'
      - type: object
        required: [cursorFecha, cursorId]
        properties:
          cursorFecha: {type: string, format: date-time}
          cursorId: {type: integer}
    CommunityComment:
      type: object
      required: [Id, ContenidoMarkdown, Autor, Spoiler, FechaCreacion]
      properties:
        Id: {type: integer}
        ContenidoMarkdown: {type: [string, 'null'], description: Es null cuando Spoiler.Oculto es true.}
        Autor: {$ref: '#/components/schemas/UserSummary'}
        LibroId: {type: [integer, 'null']}
        AntologiaId: {type: [integer, 'null']}
        Spoiler: {oneOf: [{$ref: '#/components/schemas/CommunitySpoiler'}, {type: 'null'}]}
        FechaCreacion: {type: string, format: date-time}
    CommunityCommentListResponse:
      allOf:
      - $ref: '#/components/schemas/SuccessResponse'
      - type: object
        required: [Comentarios, SiguienteCursor]
        properties:
          Comentarios: {type: array, items: {$ref: '#/components/schemas/CommunityComment'}}
