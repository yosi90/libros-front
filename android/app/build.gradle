apply plugin: 'com.android.application'

def releaseKeystorePath = System.getenv('ANDROID_KEYSTORE_PATH')
def releaseKeystorePassword = System.getenv('ANDROID_KEYSTORE_PASSWORD')
def releaseKeyAlias = System.getenv('ANDROID_KEY_ALIAS')
def releaseKeyPassword = System.getenv('ANDROID_KEY_PASSWORD')
def releaseSigningConfigured = [releaseKeystorePath, releaseKeystorePassword, releaseKeyAlias, releaseKeyPassword]
    .every { value -> value != null && !value.trim().isEmpty() }
def configuredVersionCode = Integer.parseInt(System.getenv('ANDROID_VERSION_CODE') ?: '1')
def configuredVersionName = System.getenv('ANDROID_VERSION_NAME') ?: '1.0'

android {
    namespace = "es.yosiftware.libros"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "es.yosiftware.libros"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode configuredVersionCode
        versionName configuredVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    flavorDimensions += "environment"
    productFlavors {
        qa {
            dimension "environment"
            applicationIdSuffix ".qa"
            versionNameSuffix "-qa"
        }
        production {
            dimension "environment"
        }
    }
    signingConfigs {
        release {
            if (releaseSigningConfigured) {
                storeFile file(releaseKeystorePath)
                storePassword releaseKeystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (releaseSigningConfigured) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    def flavorServicesJSON = fileTree(dir: 'src', include: '**/google-services.json')
    if ((servicesJSON.exists() && servicesJSON.text) || !flavorServicesJSON.isEmpty()) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

tasks.configureEach { task ->
    def match = task.name =~ /^pre(Qa|Production)(Debug|Release)Build$/
    if (match.matches()) {
        task.doFirst {
            def expectedFlavor = match.group(1).toLowerCase()
            def stampFile = file('src/main/assets/native-build-environment.json')
            if (!stampFile.exists()) {
                throw new GradleException("Falta el sello del frontend Android. Ejecuta npm run build:native:${expectedFlavor} antes de Gradle.")
            }
            def stamp = new groovy.json.JsonSlurper().parse(stampFile)
            if (stamp.flavor != expectedFlavor) {
                throw new GradleException("El frontend Android está sellado para ${stamp.flavor}, no para ${expectedFlavor}. Ejecuta npm run build:native:${expectedFlavor}.")
            }
            if (match.group(2) == 'Release' && !releaseSigningConfigured) {
                throw new GradleException('Una APK release exige ANDROID_KEYSTORE_PATH, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS y ANDROID_KEY_PASSWORD.')
            }
            if (match.group(2) == 'Release' && !file(releaseKeystorePath).exists()) {
                throw new GradleException('No existe el keystore release indicado por ANDROID_KEYSTORE_PATH.')
            }
        }
    }
}
