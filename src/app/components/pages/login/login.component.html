@if (presentation.state().isMobilePresentationActive) {
    <app-login-mobile-view [state]="viewState"
        (login)="doLogin()" (googleLogin)="loginWithGoogle()"
        (requestPhone)="requestPhoneCode()" (confirmPhone)="confirmPhoneCode()"
        (emailBlur)="updateEmailErrorMessage()" (passwordBlur)="updatePassErrorMessage()">
    </app-login-mobile-view>
} @else {
    <app-login-wood-view [state]="viewState"
        (login)="doLogin()" (googleLogin)="loginWithGoogle()"
        (requestPhone)="requestPhoneCode()" (confirmPhone)="confirmPhoneCode()"
        (emailBlur)="updateEmailErrorMessage()" (passwordBlur)="updatePassErrorMessage()">
    </app-login-wood-view>
}
