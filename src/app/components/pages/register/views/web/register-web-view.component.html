<app-web-auth-page eyebrow="Empieza tu memoria" title="Crea tu biblioteca."
  supporting="Guarda tus lecturas y vuelve a cada historia cuando quieras." [readingQuote]="state.readingQuote">
  <form class="web-auth-form" [formGroup]="state.form" (ngSubmit)="register.emit()">
    <label class="web-auth-field">
      <span>Correo electrónico</span>
      <span class="web-auth-input"><mat-icon aria-hidden="true">mail</mat-icon>
        <input type="email" [formControl]="state.email" autocomplete="email" maxlength="100" placeholder="tu@correo.com" (blur)="emailBlur.emit()">
      </span>
      @if (state.email.touched && state.email.invalid) {<small>{{state.emailError}}</small>}
    </label>
    <label class="web-auth-field">
      <span>Contraseña</span>
      <span class="web-auth-input"><mat-icon aria-hidden="true">lock</mat-icon>
        <input [type]="passwordHidden ? 'password' : 'text'" [formControl]="state.password" autocomplete="new-password" maxlength="20" (blur)="passwordBlur.emit()">
        <button class="icon-button" type="button" (click)="passwordHidden = !passwordHidden"
          [attr.aria-label]="passwordHidden ? 'Mostrar contraseña' : 'Ocultar contraseña'">
          <mat-icon aria-hidden="true">{{passwordHidden ? 'visibility' : 'visibility_off'}}</mat-icon>
        </button>
      </span>
      @if (state.password.touched && state.password.invalid) {<small>{{state.passwordError}}</small>}
    </label>
    <p class="web-auth-hint">Usa entre 8 y 20 caracteres, con mayúscula, minúscula, número y símbolo.</p>
    <button class="web-auth-submit" type="submit" [disabled]="state.form.invalid">Crear mi biblioteca</button>
    <p class="web-auth-footer">¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a></p>
  </form>
</app-web-auth-page>
