@if (presentation.state().isMobilePresentationActive) {
    <app-verify-email-pending-mobile-view [state]="viewState" (resend)="resendVerification()" (logout)="logout()"></app-verify-email-pending-mobile-view>
} @else {
    <app-verify-email-pending-wood-view [state]="viewState" (resend)="resendVerification()" (logout)="logout()"></app-verify-email-pending-wood-view>
}
