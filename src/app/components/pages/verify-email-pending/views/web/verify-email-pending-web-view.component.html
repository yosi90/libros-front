<app-web-auth-page eyebrow="Un último paso" title="Verifica tu correo."
  supporting="Tu cuenta está creada. Confirma el enlace que te hemos enviado para desbloquear la biblioteca."
  [backLink]="null" [readingQuote]="state.readingQuote">
  <div class="web-auth-status">
    <span class="web-auth-status__icon"><mat-icon aria-hidden="true">outgoing_mail</mat-icon></span>
    <p>Hemos enviado el enlace a <strong class="pending__email">{{state.userEmail}}</strong>.</p>
    <button class="web-auth-submit" type="button" (click)="resend.emit()" [disabled]="state.isResending">
      <mat-icon aria-hidden="true">send</mat-icon> Reenviar enlace
    </button>
    <button class="web-auth-link pending__logout" type="button" (click)="logout.emit()">Cerrar sesión</button>
  </div>
</app-web-auth-page>
