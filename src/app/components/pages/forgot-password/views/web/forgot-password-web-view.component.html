<app-web-auth-page eyebrow="Recupera el acceso" title="Vuelve a tu biblioteca."
  supporting="Te enviaremos un enlace seguro para crear una contraseña nueva." backLink="/login" [readingQuote]="state.readingQuote">
  <form class="web-auth-form" [formGroup]="state.form" (ngSubmit)="requestReset.emit()">
    <label class="web-auth-field">
      <span>Correo electrónico</span>
      <span class="web-auth-input"><mat-icon aria-hidden="true">mail</mat-icon>
        <input type="email" [formControl]="state.email" autocomplete="email" maxlength="100" placeholder="tu@correo.com" (blur)="emailBlur.emit()">
      </span>
      @if (state.email.touched && state.email.invalid) {<small>{{state.emailError}}</small>}
    </label>
    <p class="web-auth-hint">Por seguridad, mostraremos la misma confirmación exista o no una cuenta con ese correo.</p>
    <button class="web-auth-submit" type="submit" [disabled]="state.form.invalid">
      <mat-icon aria-hidden="true">mark_email_read</mat-icon> Enviar instrucciones
    </button>
    <p class="web-auth-footer"><a routerLink="/login">Volver a iniciar sesión</a></p>
  </form>
</app-web-auth-page>
