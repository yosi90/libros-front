<app-mobile-auth-page eyebrow="Recupera el acceso" title="Vuelve a tu biblioteca."
    supporting="Te enviaremos un enlace seguro para crear una contraseña nueva."
    backLink="/login" [readingQuote]="state.readingQuote">
    <form class="m-auth-form" [formGroup]="state.form" (ngSubmit)="requestReset.emit()">
        <label class="m-auth-field">
            <span>Correo electrónico</span>
            <span class="m-field"><mat-icon aria-hidden="true">mail</mat-icon>
                <input type="email" [formControl]="state.email" autocomplete="email" maxlength="100" placeholder="tu@correo.com" (blur)="emailBlur.emit()">
            </span>
            @if (state.email.touched && state.email.invalid) { <small>{{ state.emailError }}</small> }
        </label>
        <p class="forgot-mobile__privacy">Por seguridad, mostraremos la misma confirmación exista o no una cuenta con ese correo.</p>
        <button class="m-button" type="submit" [disabled]="state.form.invalid">
            <mat-icon aria-hidden="true">mark_email_read</mat-icon> Enviar instrucciones
        </button>
        <p class="m-auth-footer-link"><a routerLink="/login">Volver a iniciar sesión</a></p>
    </form>
</app-mobile-auth-page>
