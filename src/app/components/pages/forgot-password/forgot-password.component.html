@if (presentation.state().isMobilePresentationActive) {
    <app-forgot-password-mobile-view [state]="viewState" (requestReset)="requestReset()" (emailBlur)="updateEmailErrorMessage()"></app-forgot-password-mobile-view>
} @else {
    <app-forgot-password-wood-view [state]="viewState" (requestReset)="requestReset()" (emailBlur)="updateEmailErrorMessage()"></app-forgot-password-wood-view>
}
