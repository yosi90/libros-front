<div class="web-search" role="search">
  <mat-icon aria-hidden="true">search</mat-icon>
  @for (chip of chips; track chip.raw) {
    <span class="web-search__chip">
      {{chipLabel(chip)}}
      <button type="button" [attr.aria-label]="'Quitar filtro ' + chip.value" (click)="removed.emit(chip.raw)"><mat-icon>close</mat-icon></button>
    </span>
  }
  <input type="search" [placeholder]="placeholder" [attr.aria-label]="inputLabel"
    [value]="draftQuery" (input)="draftInput.emit($event)" (keydown.enter)="committed.emit('contains')">
  @if (active) {
    <button class="web-search__clear" type="button" aria-label="Limpiar filtros" (click)="cleared.emit()"><mat-icon>backspace</mat-icon></button>
  }
  @if (showSuggestions) {
    <div class="web-search__suggestions" role="listbox" aria-label="Buscar en">
      @for (option of scopes; track option.scope) {
        <button type="button" role="option" (click)="committed.emit(option.scope)">
          <mat-icon aria-hidden="true">search</mat-icon>
          <span>«{{draftQuery.trim()}}» <small>{{suggestionLabel(option)}}</small></span>
        </button>
      }
    </div>
  }
</div>
