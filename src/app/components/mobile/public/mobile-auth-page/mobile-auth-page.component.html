<app-mobile-public-shell [backLink]="backLink">
    <div class="mobile-auth-page">
        <section class="mobile-auth-page__intro" [attr.aria-labelledby]="'mobile-auth-' + title">
            <p class="m-eyebrow">{{ eyebrow }}</p>
            <h1 class="m-display" [id]="'mobile-auth-' + title">{{ title }}</h1>
            @if (supporting) {
                <p class="m-supporting">{{ supporting }}</p>
            }
            @if (readingQuote) {
                <blockquote>
                    <p>“{{ readingQuote.texto }}”</p>
                    <footer>{{ readingQuote.autor }}</footer>
                </blockquote>
            }
        </section>
        <section class="mobile-auth-page__panel m-card">
            <ng-content></ng-content>
        </section>
    </div>
</app-mobile-public-shell>
