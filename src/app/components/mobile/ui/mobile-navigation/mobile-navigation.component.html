<nav class="m-navigation" aria-label="Navegación principal">
    @for (item of items; track item.id) {
        @if (item.route) {
            <a [routerLink]="item.route" routerLinkActive="is-active" [class.m-navigation__rail-only]="item.railOnly"
                [class.m-navigation__rail-end]="item.id === 'statistics'"
                [routerLinkActiveOptions]="{ exact: item.id === 'library' }"
                [class.is-active]="active === item.id"
                [class.is-disabled]="isDisabled(item)"
                [attr.aria-disabled]="isDisabled(item)"
                (click)="isDisabled(item) && $event.preventDefault()">
                <span class="m-navigation__icon"><mat-icon aria-hidden="true">{{ item.icon }}</mat-icon></span>
                <span>{{ item.label }}</span>
            </a>
        } @else {
            <button type="button" [class.m-navigation__rail-only]="item.railOnly" [class.is-active]="moreOpen || active === item.id"
                [attr.aria-expanded]="moreOpen" aria-controls="mobile-more-panel"
                (click)="moreRequested.emit()">
                <span class="m-navigation__icon"><mat-icon aria-hidden="true">{{ item.icon }}</mat-icon></span>
                <span>{{ item.label }}</span>
            </button>
        }
    }
</nav>
