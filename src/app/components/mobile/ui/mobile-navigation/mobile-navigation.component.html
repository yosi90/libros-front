<nav class="m-navigation" aria-label="Navegación principal">
    @for (item of items; track item.id) {
        <button type="button" [class.is-active]="active === item.id" [attr.aria-current]="active === item.id ? 'page' : null">
            <span class="m-navigation__icon"><mat-icon aria-hidden="true">{{ item.icon }}</mat-icon></span>
            <span>{{ item.label }}</span>
        </button>
    }
</nav>
