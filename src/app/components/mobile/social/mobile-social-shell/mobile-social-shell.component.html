<section class="m-social-shell">
  <nav class="m-social-shell__navigation" aria-label="Secciones sociales">
    @for (item of c.items; track item.path) {
      <a [routerLink]="item.path" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }"
        [class.is-disabled]="!c.isAvailable(item)" [attr.aria-disabled]="!c.isAvailable(item)"
        [attr.tabindex]="c.isAvailable(item) ? 0 : -1">
        <span class="m-social-shell__nav-icon"><mat-icon>{{ item.icon }}</mat-icon></span>
        <span><strong>{{ item.label }}</strong><small>{{ item.description }}</small></span>
        @if (item.path === 'messages' && c.unreadCount > 0) { <em>{{ c.unreadCount > 99 ? '99+' : c.unreadCount }}</em> }
      </a>
    }
  </nav>

  <main class="m-social-shell__content"><router-outlet></router-outlet></main>
</section>
