<section class="collection-modal-backdrop" role="presentation" [attr.data-native-back-overlay]="isFullscreenPresentation ? '' : null" (click)="closeFromBackdrop()">
  <form class="collection-modal" role="dialog" aria-modal="true" aria-labelledby="collection-state-title"
    cdkTrapFocus [cdkTrapFocusAutoCapture]="true"
    (submit)="$event.preventDefault(); saveModal.emit()" (click)="$event.stopPropagation()">
    <header>
      <button class="collection-modal__close" type="button" [disabled]="isSaving"
        [attr.data-native-back-action]="isFullscreenPresentation ? '' : null"
        [attr.aria-label]="isFullscreenPresentation ? 'Volver a la biblioteca' : 'Cerrar'" (click)="requestClose()">
        <mat-icon>{{ isFullscreenPresentation ? 'arrow_back' : 'close' }}</mat-icon>
      </button>
      <div><small>Mi biblioteca</small><h2 id="collection-state-title">{{title}}</h2></div>
      @if (isFullscreenPresentation) { <span class="collection-modal__bar-spacer" aria-hidden="true"></span> }
    </header>
    <div class="collection-modal__body app-scroll-region">
      <section class="collection-modal__field">
        <span>Estado</span>
        <div class="collection-status-picker" role="radiogroup" aria-label="Estado de lectura">
          @for (status of statusOptions; track status) {
            <button type="button" role="radio"
              [class.is-active]="selectedStatus === status.Id"
              [attr.aria-checked]="selectedStatus === status.Id"
              (click)="selectedStatusChange.emit(status.Id)">
              <mat-icon>{{status.icon}}</mat-icon>
              {{status.Nombre}}
            </button>
          }
        </div>
      </section>
      <label class="collection-modal__field collection-review" [class.is-disabled]="!canWriteReview">
        <div class="collection-modal__field-header">
          <span>Reseña</span>
          <div class="collection-rating" role="radiogroup" aria-label="Puntuación">
            @if (selectedRating !== null) {
              <button class="collection-rating__clear" type="button" (click)="setRating(null)" aria-label="Quitar puntuación">
                <mat-icon>close</mat-icon>
              </button>
            }
            @for (rating of ratingOptions; track rating) {
              <button type="button" role="radio"
                [class.is-active]="selectedRating !== null && rating <= selectedRating"
                [attr.aria-checked]="selectedRating === rating"
                [attr.aria-label]="rating + ' de 5'"
                (click)="setRating(rating)">
                <mat-icon>{{selectedRating !== null && rating <= selectedRating ? 'star' : 'star_border'}}</mat-icon>
              </button>
            }
          </div>
        </div>
        <textarea rows="4" maxlength="1000" [ngModel]="selectedReview" name="collectionReview"
          (ngModelChange)="selectedReviewChange.emit($event)"
          [disabled]="!canWriteReview"
        [placeholder]="canWriteReview ? 'Añade una reseña personal' : 'Puntúa primero para escribir una reseña'"></textarea>
      </label>
      <label class="collection-modal__exclude"><input type="checkbox" [ngModel]="excludeActivity" name="excludeActivity" (ngModelChange)="excludeActivityChange.emit($event)"> No compartir esta actualización en Comunidad</label>
    </div>
    <footer>
      <button type="button" [disabled]="isSaving" (click)="requestClose()">{{ isFullscreenPresentation ? 'Volver' : 'Cancelar' }}</button>
      <button type="submit" [disabled]="isSaving || selectedStatus === null">Guardar</button>
    </footer>
  </form>
</section>
