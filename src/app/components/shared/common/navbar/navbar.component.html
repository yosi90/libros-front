@if (showLegacyLoggedNav) {
  <nav id="logged" class="topbar" aria-label="Navegación principal">
    <div class="topbar__actions">
      <a routerLink="/dashboard" matTooltip="Biblioteca" matTooltipClass="tt-accent" (click)="openLibrary($event)">
        <mat-icon>home</mat-icon>
      </a>
      <a routerLink="/dashboard/profile" matTooltip="Perfil" matTooltipClass="tt-accent" aria-label="Perfil">
        <mat-icon>person</mat-icon>
      </a>
      <app-notification-bell placement="navbar"></app-notification-bell>
      @if (isUserAdmin) {
        <a routerLink="/dashboard/adminpanel" matTooltip="Administración" matTooltipClass="tt-accent">
          <mat-icon>admin_panel_settings</mat-icon>
        </a>
      }
      <!-- La cuenta de Yosiftware: el avatar abre el panel de cuentas (cambiar, añadir y salir). -->
      <app-yosiftware-account class="topbar__account"></app-yosiftware-account>
    </div>
    <a class="topbar__brand" routerLink="/dashboard">Memoria Bibliográfica</a>
  </nav>
}
