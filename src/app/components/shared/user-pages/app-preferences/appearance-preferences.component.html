<section class="appearance">
  <header class="appearance__head">
    <h2>Apariencia</h2>
    <p>Se guarda en este dispositivo. Cada navegador puede usar un tema distinto.</p>
  </header>

  <div class="appearance__options" role="radiogroup" aria-label="Tema de la interfaz">
    @for (option of options; track option.id) {
      <button type="button" role="radio" class="appearance__option"
        [attr.aria-checked]="choice() === option.id"
        [attr.aria-disabled]="isDisabled(option)"
        [class.is-disabled]="isDisabled(option)"
        (click)="select(option)">
        <span class="appearance__swatch" [attr.data-swatch]="option.id" aria-hidden="true">
          <span></span><span></span><span></span>
        </span>
        <span class="appearance__label">
          <strong>{{option.label}}</strong>
          @if (choice() === option.id) { <mat-icon aria-hidden="true">check_circle</mat-icon> }
        </span>
        <small>{{isDisabled(option) ? 'Disponible en pantallas de escritorio (más de 1050 px).' : option.description}}</small>
      </button>
    }
  </div>

  @if (showDesktopTransitionNote()) {
    <p class="appearance__note" role="status">
      <mat-icon aria-hidden="true">info</mat-icon>
      La versión clara y oscura de escritorio se está completando. Las pantallas que aún no la tienen se muestran en Wood.
    </p>
  }
</section>
